[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maplemate"
version = "1.0.0"
description = "Windows tray companion with Maple-mcp and MapleStory skills"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "httpx>=0.28,<1", "numpy>=2,<3", "Pillow>=11,<13", "pystray>=0.19.5,<0.20; sys_platform == 'win32'", "windows-capture>=2.0.1,<3; sys_platform == 'win32'"]

[project.optional-dependencies]
build = ["pyinstaller>=6.20,<7"]

[project.scripts]
maplemate = "maplemate.cli:main"
maple-mcp = "maplemate.cli:main"

[tool.setuptools]
packages = ["maplemate", "maplemate.maple_mcp", "maplemate.skills"]
package-dir = {"" = "src", "maplemate.skills" = "skills"}

[tool.setuptools.package-data]
maplemate = ["previous_skill_hashes.json", "assets/*.ico"]
"maplemate.maple_mcp" = ["nexon_catalog.json"]
"maplemate.skills" = ["maplemate/*.md", "maplemate/references/*.md", "maplemate/agents/*.yaml"]
