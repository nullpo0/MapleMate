name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          python scripts/verify_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Source release verification failed.' }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:IS_TAG -eq 'true' -and $env:RELEASE_TAG -ne "v$version") { throw 'Tag must match project version.' }
      - run: python -m pip install ".[build]"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_maplemate_mcp.py
      - run: python scripts/build_release.py
      - run: python scripts/smoke_maplemate_mcp.py --bundle dist/MapleMate
      - run: python scripts/smoke_skill_install.py --bundle dist/MapleMate
      - run: python scripts/smoke_tray.py --bundle dist/MapleMate
      - uses: actions/upload-artifact@v4
        with:
          name: MapleMate-windows-x64
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match pyproject.toml version.' }
          $releaseAssets = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Extension -in '.zip', '.sha256' } | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @releaseAssets --draft --verify-tag --title "MapleMate $version" --notes "Windows 10/11 x64. Extract the entire ZIP and run MapleMate.exe. Python installation is not required."
